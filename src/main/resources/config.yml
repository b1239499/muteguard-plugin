# MuteGuard 設定
#
# 玩家如果目前被公開聊天禁言（例如被 CMI 的 /cmi mute 禁言），
# 這裡列出的指令也會一併被擋下，不能繼續私訊別人。
#
# 判斷「是否被禁言」的方式：送出一個模擬的公開聊天事件，看看有沒有
# 任何插件（CMI、EssentialsX 或其他任何禁言插件）會取消它。這個方式
# 完全不綁定任何特定插件，之後就算換掉禁言插件也不用改這裡的設定。

# 要攔截的指令名稱（不含斜線，全部小寫）
guarded-commands:
  - msg
  - m
  - w
  - tell
  - pm
  - reply
  - r
  - message

# 被攔下時顯示給玩家的訊息，支援 & 顏色代碼
mute-message: '&c你目前被禁言中，無法傳送密語。'
